<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ostraka</title>
  <meta name="description" content="Koine Greek vocabulary, paradigms and translation">
  <meta name="theme-color" content="#f3f1ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1e1e1e" media="(prefers-color-scheme: dark)">
  <!-- iPhone / iPad Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ostraka">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>
  <script src="js/paradigms.js"></script>
  <script src="js/logic.js"></script>
  <script src="data/practice.js"></script>
  <script src="js/tengine.js"></script>
  <script src="js/english.js"></script>
  <script src="js/translate.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Offline support only when served from a website (not file:// or the Windows app).
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
      const hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then((reg) => reg.update()).catch(() => {});
      // A new version finished downloading: reload right away on the home
      // screens, or offer a button if a sentence is in progress.
      let reloaded = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (!hadController || reloaded) return;
        const busy = (window.OT && window.OT.session) || document.querySelector(".session");
        if (!busy) { reloaded = true; location.reload(); return; }
        if (document.getElementById("upd")) return;
        const b = document.createElement("button");
        b.id = "upd"; b.className = "btn pri";
        b.style.cssText = "position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:999;box-shadow:0 6px 20px rgba(0,0,0,.3)";
        b.textContent = "Ostraka updated · Reload";
        b.onclick = () => { reloaded = true; location.reload(); };
        document.body.append(b);
      });
    }
  </script>
</body>
</html>
